services:
  - type: web
    name: campuspulse-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: python run_api.py
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://campuspulse-rho.vercel.app
      - key: RUN_SCHEDULER
        value: "true"
