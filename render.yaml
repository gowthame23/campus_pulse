services:
  - type: web
    name: campuspulse-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: python run_api.py
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://campuspulse-rho.vercel.app
      - key: RUN_SCHEDULER
        value: "true"
      - key: FRONTEND_URL
        value: https://campuspulse-rho.vercel.app
      # SMTP is required for password-reset OTP, account activation, and
      # password-changed emails to actually deliver. Without these set,
      # the backend silently treats email as "not configured" and never
      # attempts to send -- the API still returns a generic success message
      # either way (by design, to avoid leaking which emails have accounts),
      # so a missing SMTP config looks like nothing happened, not an error.
      # sync: false -- Render prompts for these in the dashboard instead of
      # reading a value from this file, so no secret is committed to git.
      - key: SMTP_SERVER
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
