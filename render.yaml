services:
  # -------------------------------------------------------------
  # 1. Backend Web Service (FastAPI Python)
  # -------------------------------------------------------------
  - type: web
    name: campuspulse-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: python run_api.py
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RUN_SCHEDULER
        value: "true"
      - key: CORS_ORIGINS
        value: "https://campuspulse-frontend.onrender.com,http://localhost:5173"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: SMTP_SERVER
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  # -------------------------------------------------------------
  # 2. Frontend Static Site (React + Vite SPA)
  # -------------------------------------------------------------
  - type: web
    name: campuspulse-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
